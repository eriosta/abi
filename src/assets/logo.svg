<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="waterColor" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EAF6FB"/>
      <stop offset="55%" stop-color="#B8DCEA"/>
      <stop offset="100%" stop-color="#7FB3D5"/>
    </radialGradient>
    <clipPath id="heartClip">
      <path d="M0,-7 C-3,-13 -12,-13 -12,-4 C-12,3 0,13 0,13 C0,13 12,3 12,-4 C12,-13 3,-13 0,-7 Z"/>
    </clipPath>
  </defs>

  <!-- Watercolor disc background -->
  <circle cx="200" cy="200" r="184" fill="url(#waterColor)" opacity="0.96"/>

  <!-- Soft inner highlight -->
  <circle cx="200" cy="200" r="162" fill="#FDFBF7" opacity="0.28"/>

  <!-- Decorative thin ring -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

  <!-- Fork (left, slight tilt inward) -->
  <g transform="translate(168, 100) rotate(-6)" fill="#1F618D">
    <rect x="-7"   y="0" width="3" height="18" rx="1.2"/>
    <rect x="-1.5" y="0" width="3" height="18" rx="1.2"/>
    <rect x="4"    y="0" width="3" height="18" rx="1.2"/>
    <rect x="-8"   y="17" width="16" height="6" rx="2"/>
    <rect x="-2"   y="23" width="4" height="50" rx="2"/>
  </g>

  <!-- Knife (right, slight tilt inward) -->
  <g transform="translate(232, 100) rotate(6)" fill="#1F618D">
    <path d="M-6,0 L6,0 L5,48 L0,58 L-5,48 Z"/>
    <rect x="-2.5" y="58" width="5" height="15" rx="2"/>
  </g>

  <!-- Main wordmark -->
  <text x="200" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="50"
        font-weight="bold" font-style="italic" text-anchor="middle" fill="#1F618D">
    Cocina Abi
  </text>

  <!-- Decorative line -->
  <line x1="148" y1="245" x2="252" y2="245" stroke="#7FB3D5" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="200" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12"
        font-weight="600" letter-spacing="3.5" text-anchor="middle" fill="#2874A6">
    SABORES DE VENEZUELA
  </text>

  <!-- Venezuelan flag heart -->
  <g transform="translate(200, 300)">
    <g clip-path="url(#heartClip)">
      <rect x="-15" y="-15" width="30" height="9.5" fill="#FFCD00"/>
      <rect x="-15" y="-5.5" width="30" height="9" fill="#003893"/>
      <rect x="-15" y="3.5"  width="30" height="11" fill="#CE1126"/>
    </g>
    <path d="M0,-7 C-3,-13 -12,-13 -12,-4 C-12,3 0,13 0,13 C0,13 12,3 12,-4 C12,-13 3,-13 0,-7 Z"
          fill="none" stroke="#1F618D" stroke-width="1.2"/>
  </g>

  <!-- Cook signature -->
  <text x="200" y="345" font-family="Georgia, serif" font-size="15" font-style="italic"
        text-anchor="middle" fill="#2874A6">
    Por Abi Norma
  </text>
</svg>
