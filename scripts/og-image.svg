<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#EAF6FB"/>
      <stop offset="60%" stop-color="#C9E3EF"/>
      <stop offset="100%" stop-color="#A8D5E5"/>
    </radialGradient>
    <radialGradient id="discBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="55%" stop-color="#EAF6FB"/>
      <stop offset="100%" stop-color="#B8DCEA"/>
    </radialGradient>
    <clipPath id="heartClip2">
      <path d="M0,-7 C-3,-13 -12,-13 -12,-4 C-12,3 0,13 0,13 C0,13 12,3 12,-4 C12,-13 3,-13 0,-7 Z"/>
    </clipPath>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle decorative dots -->
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="1120" cy="120" r="3"/>
    <circle cx="120" cy="560" r="3"/>
    <circle cx="1100" cy="540" r="3"/>
    <circle cx="50" cy="320" r="2"/>
    <circle cx="1150" cy="300" r="2"/>
  </g>

  <!-- Logo disc on the left -->
  <g transform="translate(280, 315)">
    <circle r="220" fill="url(#discBg)"/>
    <circle r="200" fill="#FDFBF7" opacity="0.32"/>
    <circle r="208" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.7"/>

    <!-- Fork + knife (matches the new logo geometry), enlarged & centered above wordmark -->
    <g transform="translate(0,-108) scale(1.55) translate(-200,-122)">
      <g transform="translate(168, 86) rotate(-6)" fill="#1A4D72">
        <rect x="-7" y="0" width="2.5" height="18" rx="1.2"/>
        <rect x="-3" y="0" width="2.5" height="18" rx="1.2"/>
        <rect x="1" y="0" width="2.5" height="18" rx="1.2"/>
        <rect x="5" y="0" width="2.5" height="18" rx="1.2"/>
        <rect x="-8" y="17" width="16" height="6" rx="2"/>
        <rect x="-2" y="23" width="4" height="50" rx="2"/>
      </g>
      <g transform="translate(232, 86) rotate(6)" fill="#1A4D72">
        <path d="M0,-1 C2.5,1 4.5,6 4.5,14 L4,52 L-4,52 L-4.5,14 C-4.5,6 -2.5,1 0,-1 Z"/>
        <rect x="-5" y="50" width="10" height="4" rx="1.5"/>
        <rect x="-3" y="54" width="6" height="19" rx="2.5"/>
      </g>
    </g>

    <!-- Wordmark -->
    <text x="0" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="60"
          font-weight="bold" font-style="italic" text-anchor="middle" fill="#1A4D72">
      Cocina Abi
    </text>

    <line x1="-62" y1="55" x2="62" y2="55" stroke="#A8D5E5" stroke-width="2"/>

    <text x="0" y="83" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.4"
          font-weight="600" letter-spacing="4.2" text-anchor="middle" fill="#1A4D72">
      SABORES DE VENEZUELA
    </text>

    <!-- Venezuelan flag heart -->
    <g transform="translate(0, 130)">
      <g clip-path="url(#heartClip2)">
        <rect x="-15" y="-15" width="30" height="9.5" fill="#FFCD00"/>
        <rect x="-15" y="-5.5" width="30" height="9" fill="#003893"/>
        <rect x="-15" y="3.5" width="30" height="11" fill="#CE1126"/>
      </g>
      <path d="M0,-7 C-3,-13 -12,-13 -12,-4 C-12,3 0,13 0,13 C0,13 12,3 12,-4 C12,-13 3,-13 0,-7 Z"
            fill="none" stroke="#1A4D72" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Right column copy -->
  <g transform="translate(620, 0)">
    <text x="0" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="74"
          font-weight="bold" font-style="italic" fill="#1A4D72">
      Cocina Abi
    </text>
    <line x1="0" y1="248" x2="120" y2="248" stroke="#B85535" stroke-width="4"/>
    <text x="0" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="32"
          font-style="italic" fill="#1A4D72" opacity="0.85">
      Sabores de Venezuela
    </text>

    <text x="0" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22"
          fill="#0F1B2A" font-weight="600">
      Comida casera venezolana
    </text>
    <text x="0" y="402" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22"
          fill="#0F1B2A" font-weight="600">
      hecha con amor por Abi Norma.
    </text>

    <text x="0" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17"
          fill="#1A4D72" opacity="0.7" letter-spacing="2">
      HOUSTON · KATY · ALREDEDORES
    </text>

    <!-- Order chip -->
    <g transform="translate(0, 510)">
      <rect x="0" y="0" width="330" height="56" rx="28" fill="#B85535"/>
      <text x="165" y="36" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18"
            font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="0.5">
        Pedidos por WhatsApp o SMS
      </text>
    </g>
  </g>
</svg>
