<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon: simplified brand mark (disc + crossed fork & knife only).
    Wordmark/tagline are intentionally dropped — they're illegible at tab size.
    Colors follow the Sereno palette (navy #1A4D72).
  -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EAF6FB"/>
      <stop offset="55%" stop-color="#B8DCEA"/>
      <stop offset="100%" stop-color="#7FB3D5"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="200" r="196" fill="url(#disc)"/>
  <circle cx="200" cy="200" r="178" fill="#FDFBF7" opacity="0.22"/>
  <circle cx="200" cy="200" r="186" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>

  <!-- Fork + knife from the logo, enlarged and centered for icon legibility -->
  <g transform="translate(200,205) scale(2.9) translate(-200,-122)">
    <g transform="translate(168, 86) rotate(-6)" fill="#1A4D72">
      <rect x="-7" y="0" width="2.5" height="18" rx="1.2"/>
      <rect x="-3" y="0" width="2.5" height="18" rx="1.2"/>
      <rect x="1" y="0" width="2.5" height="18" rx="1.2"/>
      <rect x="5" y="0" width="2.5" height="18" rx="1.2"/>
      <rect x="-8" y="17" width="16" height="6" rx="2"/>
      <rect x="-2" y="23" width="4" height="50" rx="2"/>
    </g>
    <g transform="translate(232, 86) rotate(6)" fill="#1A4D72">
      <path d="M0,-1 C2.5,1 4.5,6 4.5,14 L4,52 L-4,52 L-4.5,14 C-4.5,6 -2.5,1 0,-1 Z"/>
      <rect x="-5" y="50" width="10" height="4" rx="1.5"/>
      <rect x="-3" y="54" width="6" height="19" rx="2.5"/>
    </g>
  </g>
</svg>
