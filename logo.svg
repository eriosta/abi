<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="waterColor" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EAF6FB"/>
      <stop offset="55%" stop-color="#B8DCEA"/>
      <stop offset="100%" stop-color="#7FB3D5"/>
    </radialGradient>
    <clipPath id="heartClip">
      <path d="M0,-7 C-3,-13 -12,-13 -12,-4 C-12,3 0,13 0,13 C0,13 12,3 12,-4 C12,-13 3,-13 0,-7 Z"/>
    </clipPath>
  </defs>

  <circle cx="200" cy="200" r="184" fill="url(#waterColor)" opacity="0.96"/>
  <circle cx="200" cy="200" r="162" fill="#FDFBF7" opacity="0.28"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

  <!-- Fork (4 tines) -->
  <g transform="translate(168, 86) rotate(-6)" fill="#1F618D">
    <rect x="-7" y="0" width="2.5" height="18" rx="1.2"/>
    <rect x="-3" y="0" width="2.5" height="18" rx="1.2"/>
    <rect x="1" y="0" width="2.5" height="18" rx="1.2"/>
    <rect x="5" y="0" width="2.5" height="18" rx="1.2"/>
    <rect x="-8" y="17" width="16" height="6" rx="2"/>
    <rect x="-2" y="23" width="4" height="50" rx="2"/>
  </g>

  <!-- Knife (blade tip up, handle at bottom) -->
  <g transform="translate(232, 86) rotate(6)" fill="#1F618D">
    <path d="M0,-1 C2.5,1 4.5,6 4.5,14 L4,52 L-4,52 L-4.5,14 C-4.5,6 -2.5,1 0,-1 Z"/>
    <rect x="-5" y="50" width="10" height="4" rx="1.5"/>
    <rect x="-3" y="54" width="6" height="19" rx="2.5"/>
  </g>

  <text x="200" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="44"
        font-weight="bold" font-style="italic" text-anchor="middle" fill="#1F618D">Abi Cocina</text>

  <line x1="122" y1="222" x2="278" y2="222" stroke="#7FB3D5" stroke-width="1.5"/>

  <text x="200" y="246" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5"
        font-weight="600" letter-spacing="3" text-anchor="middle" fill="#2874A6">SABORES DE VENEZUELA</text>

  <g transform="translate(200, 280)">
    <g clip-path="url(#heartClip)">
      <rect x="-15" y="-15" width="30" height="10" fill="#FFCD00"/>
      <rect x="-15" y="-5" width="30" height="10" fill="#003893"/>
      <rect x="-15" y="5" width="30" height="10" fill="#CE1126"/>
    </g>
    <path d="M0,-7 C-3,-13 -12,-13 -12,-4 C-12,3 0,13 0,13 C0,13 12,3 12,-4 C12,-13 3,-13 0,-7 Z"
          fill="none" stroke="#1F618D" stroke-width="1.2"/>
  </g>

  <text x="200" y="318" font-family="Georgia, serif" font-size="15" font-style="italic"
        text-anchor="middle" fill="#2874A6">Por Abi Norma</text>
</svg>